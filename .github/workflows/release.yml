name: Release
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Format check
        run: pnpm exec prettier './**/**.{js,jsx,ts,tsx}' --check

      - name: Commit formatting check
        uses: wagoid/commitlint-github-action@v6

      - name: Bump version + generate notes (no commit, no tag)
        run: pnpm exec commit-and-tag-version --skip.commit --skip.tag

      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm publish --access public

      - name: Tag + GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          git tag "$version"
          git push origin "$version"
          awk '/^## /{n++} n==1' CHANGELOG.md > release-notes.md
          gh release create "$version" --title "$version" --notes-file release-notes.md